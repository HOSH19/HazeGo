[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hazego"
version = "0.1.0"
description = "Telegram outdoor air-quality advisor for Singapore haze"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "pyarrow>=15.0.0",
  "lightgbm>=4.3.0",
  "scikit-learn>=1.4.0",
  "joblib>=1.3.0",
  "python-telegram-bot>=21.0",
  "APScheduler>=3.10.0",
  "python-dotenv>=1.0.0",
  "tzdata>=2024.1",
]

[project.scripts]
hazego-bot = "src.bot.app:main"
hazego-retrain = "src.train.retrain_daily:main"
hazego-ingest = "src.ingest.history:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
