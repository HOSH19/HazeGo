name: Nightly model retrain

on:
  schedule:
    # 23:30 Asia/Singapore = 15:30 UTC
    - cron: "30 15 * * *"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Optional days to force-refresh before train (blank = last 2 days)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: nightly-retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Retrain
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          RETRAIN_MAX_MAE_REGRESSION: "0.15"
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.backfill_days }}" ]; then
            python -m src.train.retrain_daily --seed-backfill "${{ github.event.inputs.backfill_days }}"
          else
            python -m src.train.retrain_daily
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path("models/retrain_status.json").read_text())
          print(json.dumps(status.get("meta", {}), indent=2))
          if not status.get("accepted"):
              print("Quality gate rejected new weights; skipping commit of models/current.joblib")
          PY

      - name: Commit updated artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          ACCEPTED=$(python -c "import json; print(json.load(open('models/retrain_status.json'))['accepted'])")
          MAE=$(python -c "import json; print(json.load(open('models/retrain_status.json'))['meta'].get('holdout_mae'))")

          # Always allow history + metrics updates; only commit current model if accepted
          git add data/history.parquet data/retrain_metrics.csv models/meta.json models/retrain_status.json || true
          if [ "$ACCEPTED" = "True" ]; then
            git add models/current.joblib models/previous.joblib || true
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore(model): nightly retrain MAE=${MAE} accepted=${ACCEPTED} [skip ci]"
          git push
